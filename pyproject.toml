[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paypal-donations-platform"
version = "1.2.0"
description = "A modular PayPal v2 Donation Platform with one-time checkout buttons, automated confirmation emails, persistent SQLite donor log, REST API, and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "breakingthebot"}
]
keywords = ["paypal", "donations", "payments", "fastapi", "receipts", "donor-log"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "click>=8.1.7",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.3",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
paypal-donations = "paypal_donations.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --basetemp=.pytest_temp"
filterwarnings = ["ignore::Warning"]
